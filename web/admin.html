<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>筛查记录管理 · 骨衡</title><link rel="stylesheet" href="/vendor/vant.css"><link rel="stylesheet" href="/style.css"><script defer src="/vendor/vue.global.prod.js"></script><script defer src="/vendor/vant.min.js"></script><script type="module" src="/admin.js"></script></head><body>
<header><div class="bar"><a class="brand" href="/"><span class="mark">✳</span> 骨衡</a><span class="line"></span><span>筛查管理</span><a class="tail" href="/">筛查首页</a></div></header>
<main id="app" class="admin" v-cloak><section v-if="!allowed" class="card login"><p class="kicker">管理入口</p><h1>管理员登录</h1><p>{{loading?'正在验证登录状态…':'请使用已获授权的账号登录，查看筛查记录与随访进度。'}}</p><p class="error" v-if="error">{{error}}</p><a class="action" target="_top" href="/signin-with-chatgpt?return_to=%2Fadmin">使用 ChatGPT 账号登录</a></section>
<template v-else><div class="top"><div><p class="kicker">随访工作台</p><h1>筛查记录</h1></div><a target="_top" href="/signout-with-chatgpt?return_to=%2Fadmin">退出登录</a></div>
<button class="secondary" type="button" @click="pendingRisk">最近一次高风险 · 待跟进</button><span v-if="active.latest">　仅显示每人最近一次记录</span><form class="filters" @submit.prevent="load(true)"><label>参与者编号<input v-model.trim="filters.participant" placeholder="完整编号"></label><label>起始日期<input type="date" v-model="filters.from"></label><label>结束日期<input type="date" v-model="filters.to"></label><label>筛查风险<select aria-label="筛查风险" v-model="filters.risk"><option value="">全部风险</option><option v-for="s in risks">{{s}}</option></select></label><label>跟进状态<select aria-label="跟进状态筛选" v-model="filters.follow"><option value="">全部状态</option><option v-for="s in followStates">{{s}}</option></select></label><van-button type="primary" native-type="submit">筛选</van-button><button class="secondary" type="button" @click="clear">重置</button></form>
<section class="counts" aria-label="最近一次筛查人数"><div v-for="s in risks"><small>{{s}}</small><strong>{{groups.find(g=>g.risk===s)?.n||0}} <em>人</em></strong></div></section><p>筛查人数 {{groups.reduce((n,g)=>n+g.n,0)}} 人 · 有效 OSTA {{groups.filter(g=>['低风险','中风险','高风险'].includes(g.risk)).reduce((n,g)=>n+g.n,0)}} 人 · 高风险 {{groups.find(g=>g.risk==='高风险')?.n||0}} 人</p><p class="hint">人数按每位参与者最近一次筛查统计，再应用当前筛选条件。</p>
<div class="card"><div class="top"><h2>历次筛查 <small>{{total}} 条</small></h2><button class="secondary" @click="download" :disabled="busy">导出筛选结果 CSV</button></div>
<p class="error" role="alert" v-if="error">{{error}}</p><p v-if="busy" role="status">正在读取…</p><p v-else-if="!rows.length">当前条件下没有记录。</p>
<article class="row" v-for="r in rows" :key="r.id"><div><button class="link" @click="history(r.participant)">{{r.participant}}</button><small>{{when(r.created)}}（北京时间）</small></div><div><b>{{r.risk}}</b><small>OSTA {{r.osta??'—'}} · BMI {{formatBmi(r.bmi)}} · {{r.category}}</small></div><div><small>跟进状态</small><b>{{r.follow}}</b></div><button class="secondary" @click="edit(r)">详情 / 更正</button></article>
<div v-if="total>100" class="pager"><button :disabled="offset===0" @click="page(-100)">上一页</button>{{offset+1}}–{{Math.min(total,offset+100)}}<button :disabled="offset+100>=total" @click="page(100)">下一页</button></div></div>
<section class="card editor" v-if="record" id="editor"><div class="top"><div><p class="kicker">单次筛查</p><h2>记录详情与更正</h2></div><button class="link" @click="record=null">关闭</button></div><p>{{record.participant}} · {{when(record.created)}}</p>
<p>OSTA {{record.osta??'—'}} · {{record.risk}}　BMI {{formatBmi(record.bmi)}} · {{record.category}}</p><p v-if="record.reason">{{record.reason}}</p><p>换算体重 {{record.kg}} 公斤</p>
<form @submit.prevent="change('follow')"><label>跟进状态<select v-model="follow"><option v-for="s in followStates">{{s}}</option></select></label><button class="secondary">保存跟进状态</button></form>
<form @submit.prevent="change('correct')"><measurement-fields :entry="entry"></measurement-fields><p class="hint">更正会重新计算原记录的结果，筛查日期保持原值。复测请从筛查首页提交。</p><van-button type="primary" native-type="submit">保存更正</van-button></form><p role="status">{{editorMessage}}</p></section></template></main></body></html>
